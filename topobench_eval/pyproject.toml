[project]
name = "topobench_eval"
version = "0.1.0"
description = "Shared utilities for the TopoBench evaluation pipelines (gym + lmms_eval)."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["topobench_eval*"]
