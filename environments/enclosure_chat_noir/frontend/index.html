<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enclosure Chat Noir</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f1ec;
        --panel: #fbfaf7;
        --panel-border: #d9d2c4;
        --text: #21303b;
        --muted: #6d7b86;
        --accent: #ea7f26;
        --accent-soft: rgba(234, 127, 38, 0.12);
        --blocked: #242629;
        --open: #ece8df;
        --success: #dff0d5;
        --failure: #f7dcdf;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Avenir Next", "Trebuchet MS", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(234, 127, 38, 0.15), transparent 28%),
          linear-gradient(180deg, #f7f4ee 0%, #ece8e0 100%);
      }

      #app-shell {
        width: min(1480px, calc(100vw - 32px));
        margin: 18px auto;
        display: grid;
        grid-template-columns: minmax(860px, 2fr) minmax(320px, 1fr);
        gap: 18px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 28px;
        box-shadow: 0 20px 50px rgba(36, 38, 41, 0.08);
      }

      #board-card {
        padding: 18px 18px 12px;
      }

      #board-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding: 0 8px 12px;
      }

      #board-title {
        margin: 0;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0.01em;
      }

      #board-subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 17px;
      }

      #board-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .badge {
        border-radius: 999px;
        padding: 7px 14px;
        background: var(--accent-soft);
        color: #934d16;
        font-size: 14px;
        font-weight: 700;
      }

      #scene-container {
        position: relative;
        width: 100%;
        height: 760px;
        overflow: hidden;
        border-radius: 24px;
        background: #faf8f2;
      }

      #legend {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        padding: 14px 8px 4px;
        color: var(--muted);
        font-size: 15px;
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 9px;
      }

      .legend-swatch {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1px solid rgba(33, 48, 59, 0.16);
      }

      #control-card {
        padding: 22px;
        display: grid;
        gap: 18px;
        align-content: start;
      }

      .control-section {
        display: grid;
        gap: 10px;
      }

      .section-label {
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }

      .field-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 14px;
        color: var(--muted);
      }

      input,
      select,
      button {
        font: inherit;
      }

      input,
      select {
        width: 100%;
        padding: 11px 13px;
        border-radius: 14px;
        border: 1px solid var(--panel-border);
        background: #ffffff;
        color: var(--text);
      }

      button {
        border: 0;
        border-radius: 14px;
        padding: 12px 16px;
        font-weight: 700;
        cursor: pointer;
      }

      #reset-btn {
        background: #24323d;
        color: #f7fbff;
      }

      #step-btn {
        background: var(--accent);
        color: #ffffff;
      }

      #state-json {
        min-height: 260px;
        max-height: 420px;
        overflow: auto;
        padding: 16px;
        border-radius: 18px;
        background: #1c242c;
        color: #f4f8fb;
        font-family: "SFMono-Regular", "Menlo", monospace;
        font-size: 12px;
        line-height: 1.48;
        white-space: pre-wrap;
      }

      @media (max-width: 1200px) {
        #app-shell {
          grid-template-columns: 1fr;
        }

        #scene-container {
          height: 680px;
        }
      }

      @media (max-width: 820px) {
        #app-shell {
          width: min(100vw - 16px, 100%);
          margin: 8px auto;
        }

        #scene-container {
          height: 560px;
        }

        .field-grid {
          grid-template-columns: 1fr;
        }

        #board-title {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main id="app-shell">
      <section id="board-card" class="panel">
        <header id="board-header">
          <div>
            <h1 id="board-title">Chat Noir</h1>
            <p id="board-subtitle">Block one open hex cell per turn before the cat reaches the boundary.</p>
          </div>
          <div id="board-badges">
            <span id="policy-badge" class="badge">Difficulty: easy</span>
            <span id="status-badge" class="badge">State: active</span>
          </div>
        </header>
        <div id="scene-container">
          <div id="board-root" style="position:absolute; inset:0;"></div>
        </div>
        <div id="legend">
          <span class="legend-item"><span class="legend-swatch" style="background: var(--open);"></span> Open</span>
          <span class="legend-item"><span class="legend-swatch" style="background: var(--blocked);"></span> Blocked</span>
          <span class="legend-item"><span class="legend-swatch" style="background: #f4af32;"></span> Cat</span>
          <span class="legend-item"><span class="legend-swatch" style="background: rgba(84, 134, 201, 0.22); border-style: dashed;"></span> Boundary</span>
        </div>
      </section>

      <aside id="control-card" class="panel">
        <section class="control-section">
          <div class="section-label">Reset</div>
          <div class="field-grid">
            <label>
              Board radius
              <input id="radius-input" type="text" value="auto" />
            </label>
            <label>
              Initial blocked
              <input id="blocked-input" type="text" value="auto" />
            </label>
            <label>
              Min winning starts
              <input id="min-starts-input" type="text" value="auto" />
            </label>
            <label>
              Cat policy
              <select id="policy-input">
                <option value="easy" selected>easy</option>
                <option value="medium">medium</option>
                <option value="hard">hard</option>
              </select>
            </label>
            <label>
              Seed
              <input id="seed-input" type="number" min="1" step="1" value="1" />
            </label>
            <label>
              Action index
              <input id="action-input" type="number" min="0" max="60" step="1" value="0" />
            </label>
          </div>
          <div class="field-grid">
            <button id="reset-btn" type="button">Reset Board</button>
            <button id="step-btn" type="button">Block Cell</button>
          </div>
        </section>

        <section class="control-section">
          <div class="section-label">State</div>
          <pre id="state-json"></pre>
        </section>
      </aside>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
