name: continuity_2d_maze
eval_kind: reasoning
# Minimal snapshot default: use the retained fixed reasoning question set.
data_root: environments/continuity_2d_maze/output
question_jsonl: ${env.data_root}/question.jsonl
image_root: ${env.data_root}
system_prompt_key: continuity_2d_maze_interleaved
# Force exactly one image-gen call per sample even when the model declines
# via <image_prompt>none</image_prompt>. agent_runner.py reads this flag and
# overrides model.image_gen.{enforce_image_call, enforce_against_decline,
# max_image_gen_calls=1}.
require_image_gen: true
