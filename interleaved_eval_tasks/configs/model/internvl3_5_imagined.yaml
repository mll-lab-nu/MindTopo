id: internvl3_5_imagined
kind: interleaved
provider: internvl
keep_message_history: false

text:
  text_model_id: internvl3_5
  temperature: 0.0
  max_tokens: 4096
  api_retries: 5
  retry_sleep_seconds: 5.0
  requests_per_minute: 5.0   # Intern AI free tier is 5 RPM/key
  request_timeout_seconds: 180.0
  extra_headers: {}

image_gen:
  upstream_model_name: gpt-image-2
  base_url: https://api.openai.com/v1
  base_url_env: ""
  api_key_env: OPENAI_API_KEYS
  # mode=edits → POST multipart to /v1/images/edits with the current observation
  # PNG as the reference image; gpt-image-1 conditions on both image+text. The
  # interleaved client picks the most recent SavedImage(label="current") from
  # the inbound images list. Switch to "generations" for text-only image-gen.
  mode: edits
  size: "1024x1024"
  # gpt-image-1 always returns b64_json and rejects an explicit `response_format`;
  # leave empty so the request omits the field. The decoder handles b64_json natively.
  response_format: ""
  api_retries: 3
  retry_sleep_seconds: 2.0
  requests_per_minute: 0.0
  request_timeout_seconds: 240.0
  extra_headers: {}
  extra_payload:
    # "low" tier ≈ $0.011 per 1024×1024 image (vs $0.04 for medium, $0.167 for high)
    quality: low
  # Force an image-gen call every cycle even when phase 1 omits the
  # <image_prompt> tag — falls back to phase-1 text/reasoning_content.
  enforce_image_call: true
  # Hard cap on image-gen calls per episode (regardless of step_budget).
  # At ~$0.011/call (low quality), 10 calls is ~$0.11 worst-case per episode.
  max_image_gen_calls: 10
