id: ling_imagined
kind: interleaved
provider: openrouter
keep_message_history: false

# Inner text VLM: InclusionAI Ling-2.6-1T (free OpenRouter tier).
text:
  text_model_id: ling_2_6_1t_openrouter
  temperature: 0.0
  max_tokens: 8192
  api_retries: 3
  retry_sleep_seconds: 2.0
  requests_per_minute: 20.0   # OpenRouter free tier ~20 RPM/key
  request_timeout_seconds: 240.0
  extra_headers: {}

image_gen:
  upstream_model_name: gpt-image-2
  base_url: https://api.openai.com/v1
  base_url_env: ""
  api_key_env: OPENAI_API_KEYS
  mode: edits
  size: "1024x1024"
  response_format: ""
  api_retries: 3
  retry_sleep_seconds: 2.0
  requests_per_minute: 0.0
  request_timeout_seconds: 240.0
  extra_headers: {}
  extra_payload:
    quality: low
  enforce_image_call: true
  max_image_gen_calls: 10
