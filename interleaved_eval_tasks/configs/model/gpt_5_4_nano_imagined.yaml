id: gpt_5_4_nano_imagined
kind: interleaved
provider: openrouter
keep_message_history: false
workers_per_key: 4

# Inner text VLM: openai/gpt-5.4-nano via OpenRouter (cheap paid tier).
text:
  text_model_id: gpt_5_4_nano_openrouter
  temperature: 0.1
  max_tokens: 4096          # OpenRouter floor for this model is 16
  api_retries: 3
  retry_sleep_seconds: 2.0
  requests_per_minute: 60.0
  request_timeout_seconds: 120.0
  extra_headers: {}

image_gen:
  upstream_model_name: gpt-image-2
  base_url: https://api.openai.com/v1
  base_url_env: ""
  api_key_env: OPENAI_API_KEYS
  mode: edits
  size: "1024x1024"
  response_format: ""
  api_retries: 3
  retry_sleep_seconds: 2.0
  requests_per_minute: 0.0
  request_timeout_seconds: 240.0
  extra_headers: {}
  extra_payload:
    quality: low
  enforce_image_call: true
  max_image_gen_calls: 10
